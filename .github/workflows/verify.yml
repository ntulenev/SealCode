name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: dotnet restore src/SealCode.slnx --source https://api.nuget.org/v3/index.json
      - run: dotnet test src/SealCode.slnx --no-restore --collect:"XPlat Code Coverage" --results-directory coverage/server
      - name: Merge server coverage by source lines
        run: |
          dotnet tool install --tool-path .tools dotnet-reportgenerator-globaltool --version 5.5.4
          .tools/reportgenerator '-reports:coverage/server/**/coverage.cobertura.xml' '-targetdir:coverage/merged' '-reporttypes:Html;Cobertura;TextSummary'
      - name: Client tests and separate JS coverage
        run: node --test --experimental-test-coverage '--test-coverage-include=src/SealCode/wwwroot/*.js' --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/client.lcov tests/client/*.test.js
      - run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm run test:smoke
      - run: npx playwright test --grep-invert @smoke
      - name: Production HTTPS tests
        run: |
          dotnet dev-certs https
          npx playwright test --config playwright.https.config.js
      - name: Dependency advisories
        run: |
          npm audit --audit-level=high
          dotnet list src/SealCode.slnx package --vulnerable --include-transitive --source https://api.nuget.org/v3/index.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            coverage/
            test-results/
            playwright-report/
