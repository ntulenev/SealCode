name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEALCODE_STATISTICS_ISOLATED_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      SEALCODE_SNIPPETS_ISOLATED_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      ConnectionStrings__SealCode: Host=localhost;Port=5432;Database=sealcode;Username=postgres;Password=postgres
      SEALCODE_SNIPPETS_EDITOR_TEST_CONNECTION: Host=localhost;Port=5432;Database=sealcode;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: dotnet restore src/SealCode.slnx --source https://api.nuget.org/v3/index.json
      - name: Verify C# formatting and style
        run: dotnet format src/SealCode.slnx --verify-no-changes --no-restore
      - run: dotnet test src/SealCode.slnx --no-restore --collect:"XPlat Code Coverage" --results-directory coverage/server
      - name: Merge server coverage by source lines
        run: |
          dotnet tool install --tool-path .tools dotnet-reportgenerator-globaltool --version 5.5.4
          .tools/reportgenerator '-reports:coverage/server/**/coverage.cobertura.xml' '-targetdir:coverage/merged' '-reporttypes:Html;Cobertura;TextSummary'
      - name: Client tests and separate JS coverage
        run: npm run test:client
      - run: npx playwright install --with-deps chromium
      - name: Build client assets for browser tests
        run: npm run build:client
      - name: Prepare shared disposable browser database
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb sealcode
          psql -v ON_ERROR_STOP=1 -d sealcode -f src/Persistence/Statistics/Migrations/001_usage_statistics.sql
          psql -v ON_ERROR_STOP=1 -d sealcode -f src/Persistence/Snippets/Migrations/001_create_snippets.sql
          psql -v ON_ERROR_STOP=1 -d sealcode -f src/Persistence/Snippets/Migrations/002_question_steps.sql
          psql -v ON_ERROR_STOP=1 -d sealcode -c "INSERT INTO snippets.categories(language,title) VALUES ('general','General'); INSERT INTO snippets.questions(language,number,topic,description,markdown) VALUES ('general',1,'Original','Coverage','Original source');"
      - name: Smoke test
        run: npm run test:smoke
      - run: npx playwright test --grep-invert @smoke
      - name: Production HTTPS tests
        run: |
          dotnet dev-certs https
          npx playwright test --config playwright.https.config.js
      - name: Dependency advisories
        run: |
          npm audit --audit-level=high
          dotnet list src/SealCode.slnx package --vulnerable --include-transitive --source https://api.nuget.org/v3/index.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            coverage/
            test-results/
            playwright-report/
