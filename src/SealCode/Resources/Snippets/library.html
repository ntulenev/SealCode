<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Question library — SealCode</title>
  <link rel="icon" href="/favicon.ico?v=1.12.0" />
  <script src="/theme.js?v=1.12.0"></script>
  <link rel="stylesheet" href="/site.css?v=1.12.0" />
  <link rel="stylesheet" href="/snippets.css?v=1.12.0" />
  <link rel="stylesheet" href="/assets/snippets-main.css?v=1.12.0" />
</head>
<body class="snippet-page">
  <header class="site-header"><a class="brand" href="/admin"><img src="/Logo.png?v=1.12.0" width="56" height="48" alt="" /><span>Seal<span class="brand-code">Code</span></span></a><a href="/admin">Back to rooms ↗</a></header>
  <main class="snippet-workspace">
    <div class="page-heading"><div><p class="eyebrow">The interviewer's companion</p><h1>Question library<span class="accent">.</span></h1><p class="section-description">A starting point for your next technical conversation.</p></div></div>
    <nav id="snippetTabs" class="snippet-tabs" aria-label="Question languages"></nav>
    <div class="snippet-layout">
      <aside>
        <label class="snippet-search" for="snippetSearch">Search questions<input id="snippetSearch" type="search" placeholder="Number, topic or description" aria-describedby="snippetSearchSummary" /></label>
        <p id="snippetSearchSummary" class="snippet-search-summary muted" aria-live="polite"></p>
        <p class="eyebrow snippet-list-label">No. / Topic</p>
        <nav id="snippetQuestions" aria-label="Questions"></nav>
      </aside>
      <section class="snippet-detail" aria-labelledby="snippetTitle">
        <div class="snippet-detail-heading"><h2 id="snippetTitle">Choose a question</h2><button id="copySnippet" class="ghost" disabled>Copy snippet</button></div>
        <p id="snippetDescription" class="snippet-description muted"></p>
        <p id="snippetStatus" class="muted" role="status"></p>
        <div id="snippetContent"></div>
      </section>
    </div>
  </main>
  <script type="module" src="/assets/snippets-main.js?v=1.12.0"></script>
</body>
</html>
