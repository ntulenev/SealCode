<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A small, shared workspace for writing code together." />
  <title>Room — SealCode</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1.9.1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1.9.1" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1.9.1" />
  <script src="/theme.js?v=1.9.1"></script>
  <link rel="stylesheet" href="/site.css?v=1.9.1" />
  <link rel="stylesheet" href="/room.css?v=1.9.1" />
  <link rel="stylesheet" href="/assets/room.css?v=1.9.1" />
  <script src="/version.js?v=1.9.1" defer></script>
</head>
<body class="room-page">
  <header class="site-header"><a class="brand" href="/" aria-label="SealCode home"><img src="/Logo.png?v=1.9.1" width="56" height="48" alt="" /><span>Seal<span class="brand-code">Code</span></span></a><nav class="header-actions" aria-label="Main navigation"><a href="/">Home <span aria-hidden="true">↗</span></a><button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme" title="Switch to light theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg><span data-theme-label>Light</span></button></nav></header>
  <main class="room-container">
    <header class="room-header">
      <div class="room-heading"><p class="eyebrow">Shared workspace</p><h1 id="roomName">Your room</h1><p class="room-info"><span>Connection: <strong id="connectionStatus">disconnected</strong></span><span>Created by: <span id="createdBy">unknown</span></span></p></div>
      <div class="room-meta">
        <label for="languageSelect">Language<select id="languageSelect" disabled><option value="">Loading...</option></select></label>
        <span class="version">Version <span id="versionNumber">0</span></span>
        <button id="deleteRoom" class="ghost room-delete hidden" type="button" aria-label="Delete room" title="Delete room">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5m4-5v5" /></svg>
        </button>
      </div>
    </header>
    <p id="deleteRoomError" class="error hidden" role="alert"></p>
    <p id="syncError" class="error hidden" role="status"></p>
    <button id="downloadLocalText" class="ghost hidden" type="button">Download local text</button>
    <section class="room-main" aria-label="Collaborative editor">
      <section class="participants-bar" aria-labelledby="participants-title"><h2 id="participants-title">In this room</h2><ul id="participantsList"></ul></section>
      <section class="editor" aria-label="Code editor"><div id="monacoEditor" class="monaco-host"></div></section>
    </section>
  </main>
  <div id="joinOverlay" class="overlay">
    <form class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="joinTitle" aria-describedby="joinDescription">
      <div class="dialog-top"><img src="/Logo.png?v=1.9.1" width="94" height="81" alt="" /><button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme" title="Switch to light theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg><span data-theme-label>Light</span></button></div>
      <p class="eyebrow">Let's build something</p>
      <h2 id="joinTitle">Join room</h2>
      <p id="joinDescription" class="muted">Choose the name your teammates will see.</p>
      <label for="displayNameInput">Display name</label>
      <input id="displayNameInput" type="text" placeholder="Ada Lovelace" autocomplete="nickname" maxlength="64" aria-describedby="joinError" disabled />
      <button id="joinBtn" type="submit" disabled><span data-join-label>Loading editor…</span><span aria-hidden="true">→</span></button>
      <p id="joinError" class="error hidden" role="alert"></p>
    </form>
  </div>
  <footer class="site-footer"><span>Made for small teams. Built to share ideas.</span><a href="/about.html">About SealCode</a><span class="app-version" data-app-version>SealCode</span></footer>
  <script type="module" src="/assets/room.js?v=1.9.1"></script>
</body>
</html>
