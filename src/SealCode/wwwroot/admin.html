<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A small, shared workspace for writing code together." />
  <title>Rooms — SealCode</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1.11.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1.11.0" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1.11.0" />
  <script src="/theme.js?v=1.11.0"></script>
  <link rel="stylesheet" href="/site.css?v=1.11.0" />
  <link rel="stylesheet" href="/admin.css?v=1.11.0" />
  <script type="module" src="/assets/admin-token-main.js?v=1.11.0"></script>
  <script src="/version.js?v=1.11.0" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/" aria-label="SealCode home"><img src="/Logo.png?v=1.11.0" width="56" height="48" alt="" /><span>Seal<span class="brand-code">Code</span></span></a><nav class="header-actions" aria-label="Main navigation"><a href="/about.html">About</a><form method="post" action="/admin/logout"><button type="submit" class="ghost">Logout</button></form><button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme" title="Switch to light theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg><span data-theme-label>Light</span></button></nav></header>
  <main class="workspace admin-workspace">
    <p id="adminGreeting" class="admin-greeting" role="status"></p>
    <nav class="admin-nav" aria-label="Administration"><a href="/admin" aria-current="page">Rooms</a><a href="/admin/limits">Limits</a></nav>
    <div class="page-heading"><div><p class="eyebrow">Room management</p><h1>Your shared spaces<span class="accent">.</span></h1><p class="section-description">Create a room and invite your people.</p></div></div>
    <section class="workspace-section create-section" aria-labelledby="create-title">
      <h2 id="create-title">Create room</h2>
      <div class="create-grid">
        <label for="roomName">Room name (up to 160 characters)<input id="roomName" type="text" placeholder="e.g. Interview with Ivan Ivanov — Senior .NET Developer" maxlength="160" /></label>
        <label for="roomLanguage">Default language<select id="roomLanguage" disabled><option value="">Loading...</option></select></label>
        <button id="createRoom">Create room <span aria-hidden="true">+</span></button>
      </div>
      <p id="createResult" class="muted result-message" role="status"></p>
    </section>
    <section class="workspace-section" aria-labelledby="rooms-title">
      <div class="section-heading"><h2 id="rooms-title">Rooms</h2><label class="room-filter"><input id="myRoomsOnly" type="checkbox" checked />Only my rooms</label></div>
      <div class="room-table-heading" aria-hidden="true"><span>Room</span><span>Language</span><span>People</span><span>Updated</span><span>Created by</span><span>Actions</span></div>
      <div id="rooms"></div>
    </section>
  </main>
  <footer class="site-footer"><span>Made for small teams. Built to share ideas.</span><a href="/about.html">About SealCode</a><span class="app-version" data-app-version>SealCode</span></footer>
  <script type="module" src="/assets/admin-main.js?v=1.11.0"></script>
</body>
</html>
