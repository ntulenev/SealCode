<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A small, shared workspace for writing code together." />
  <title>Admin login — SealCode</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="stylesheet" href="/site.css?v=20261029" />
  <link rel="stylesheet" href="/admin.css?v=20261029" />
  <script type="module" src="/admin-token-main.js"></script>
  <script src="/version.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/" aria-label="SealCode home"><img src="/Logo.png" width="56" height="48" alt="" /><span>Seal<span class="brand-code">Code</span></span></a><nav class="header-actions" aria-label="Main navigation"><a href="/">Back to home <span aria-hidden="true">↗</span></a></nav></header>
  <main class="auth-layout">
    <div class="auth-art"><img src="/Logo.png" width="1355" height="1161" alt="The SealCode seal, ready to code" /><p class="eyebrow">A little space for big ideas</p></div>
    <section class="auth-content" aria-labelledby="login-title">
      <p class="eyebrow">Your workspace</p>
      <h1 id="login-title">Admin login</h1>
      <p class="section-description">Sign in to create and manage rooms.</p>
      <form class="auth-form" method="post" action="/admin/login">
        <label for="name">Admin name</label>
        <input id="name" name="name" type="text" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Login <span aria-hidden="true">→</span></button>
        <p id="error" class="error hidden" role="alert">Invalid credentials. Try again.</p>
      </form>
    </section>
  </main>
  <footer class="site-footer"><span>Made for small teams. Built to share ideas.</span><a href="/about.html">About SealCode</a><span class="app-version" data-app-version>SealCode</span></footer>
  <script src="/admin-login.js" defer></script>
</body>
</html>
