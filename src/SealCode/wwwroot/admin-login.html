<body>

            <image id="seal-artwork" href="/Logo.png?v=1.10.0" width="1355" height="1161" />

            <mask id="seal-keyboard" maskUnits="userSpaceOnUse" x="0" y="0" width="1355" height="1161">
              <rect width="1355" height="1161" fill="white" />
              <path d="M619 797 673 786 716 808 716 841 690 850 671 838 651 852 619 833Z M818 737 875 732 890 755 888 781 872 789 850 779 830 793 818 775Z" fill="black" />

          <g class="seal-paw seal-paw-near"><use href="#seal-artwork" clip-path="url(#seal-paw-near)" /></g>

            <path d="M802 455 861 440V450L813 463V482H803Z" fill="#0b1020" />

        </svg><p class="eyebrow">A little space for big ideas</p></div>
    <section class="auth-content" aria-labelledby="login-title">
      <p class="eyebrow">Your workspace</p>
      <h1 id="login-title">Admin login</h1>
      <p class="section-description">Sign in to create and manage rooms.</p>
      <form class="auth-form" method="post" action="/admin/login">
        <label for="name">Admin name</label>
        <input id="name" name="name" type="text" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Login <span aria-hidden="true">→</span></button>
        <p id="error" class="error hidden" role="alert">Invalid credentials. Try again.</p>
      </form>
      <div id="google-login" class="google-login hidden">
        <p class="google-login-divider">Or sign in with your organization account</p>
        <div id="google-signin"></div>
        <p id="google-error" class="error hidden" role="alert">Google sign-in failed. Try again.</p>
      </div>
    </section>
  </main>
  <footer class="site-footer"><span>Made for small teams. Built to share ideas.</span><a href="/about.html">About SealCode</a><span class="app-version" data-app-version>SealCode</span></footer>
  <script type="module" src="/assets/admin-login-main.js?v=1.10.0"></script>
